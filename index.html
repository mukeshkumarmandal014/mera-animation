<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .space {
            width: 100%;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle, #182848, #000000 70%);
        }

        /* Stars */
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: blink 2s infinite alternate;
        }

        .star:nth-child(1) { left: 10%; top: 20%; }
        .star:nth-child(2) { left: 30%; top: 10%; animation-delay: .5s; }
        .star:nth-child(3) { left: 50%; top: 30%; animation-delay: 1s; }
        .star:nth-child(4) { left: 70%; top: 15%; animation-delay: .3s; }
        .star:nth-child(5) { left: 90%; top: 40%; animation-delay: .8s; }
        .star:nth-child(6) { left: 20%; top: 70%; animation-delay: 1.2s; }
        .star:nth-child(7) { left: 60%; top: 80%; animation-delay: .6s; }
        .star:nth-child(8) { left: 80%; top: 65%; animation-delay: 1.5s; }

        @keyframes blink {
            from {
                opacity: 0.2;
                transform: scale(1);
            }

            to {
                opacity: 1;
                transform: scale(2);
            }
        }

        /* Planet */
        .planet {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #4facfe,
                #0066ff,
                #001b5e
            );

            box-shadow:
                0 0 30px #008cff,
                0 0 80px #0055ff;

            animation: movePlanet 8s linear infinite;
        }

        @keyframes movePlanet {
            0% {
                left: -180px;
                top: 70%;
                transform: rotate(0deg);
            }

            50% {
                left: 45%;
                top: 20%;
                transform: rotate(180deg);
            }

            100% {
                left: 110%;
                top: 70%;
                transform: rotate(360deg);
            }
        }

        /* Title */
        .title {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 40px;
            text-shadow: 0 0 20px #00aaff;
        }
    </style>
</head>

<body>

    <div class="space">

        <h1 class="title">SPACE ANIMATION</h1>

        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>

        <div class="planet"></div>

    </div>

</body>
</html>
